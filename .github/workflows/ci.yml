name: MedLens CI/CD Pipeline & Automated Evaluation

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Build, Audit, Lint & Test Suite (100% Target)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Verification
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Security Audit
        run: npm audit --audit-level=high || true

      - name: Run Vitest Unit & Integration Test Suite
        run: npm test

      - name: Generate Code Coverage Report
        run: npm run test:coverage || true

      - name: Next.js Production Build Test
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI: "mongodb://localhost:27017/medlens_ci"
          JWT_SECRET: "ci_jwt_secret_key_12345"
